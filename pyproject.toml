[project]
name = "einherjar"
version = "0.1.0"
description = "Einherjar — the fleet layer's server: served procedures and the session registry."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Alviandi Widiasto", email = "alviandi@msn.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=3.4.6",
    "psycopg[binary,pool]>=3.3.6",
    "uvicorn>=0.52.1",
]

[project.scripts]
einherjar = "einherjar.__main__:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "postgres: requires a running PostgreSQL (set EINHERJAR_PG_TEST_URL)",
]
testpaths = ["tests"]
pythonpath = ["."]
